; ============================================================================
;  PlatformIO project - Greenhouse controller, ATxmega128A1 / A3
;
;    pio run                       build   (default env: atxmega128a1)
;    pio run -t upload             program via PDI (Atmel-ICE by default)
;    pio run -e atxmega128a3       build for ATxmega128A3 boards
;    pio run -t size               memory usage
;    pio run -t clean
;
;  Bare-metal project (no Arduino framework): avr-gcc + avr-libc only.
;  Layout follows the PlatformIO standard:  include/  src/  lib/<library>/
;  The pins and options are in include/user_config.h.
;  The boards are defined in boards/*.json (PlatformIO has no built-in
;  ATxmega128A1/A3 board).
; ============================================================================

[platformio]
default_envs = atxmega128a1

[env]
platform = atmelavr
; no framework -> bare metal

; every folder in lib/ is a library; find the dependencies of all of them
lib_ldf_mode = deep+
; link library objects directly (keeps the interrupt handlers inside the
; libraries from being dropped by the linker)
lib_archive = no

; IMPORTANT: PlatformIO gives include/ only to src/, NOT to the libraries in lib/.
; Every library includes "user_config.h", so include/ must be added here.
build_flags =
    -Iinclude
    -Wall
    -Wextra

; ---- programmer -------------------------------------------------------------
; ATxmega is programmed through PDI. Examples: atmelice_pdi, avrispmkii,
; jtag3pdi, pickit4_pdi, dragon_pdi
upload_protocol = atmelice_pdi
; If your upload fails, use this instead:
;   upload_protocol = custom
;   upload_command = avrdude -p x128a1 -c atmelice_pdi -U flash:w:$SOURCE:i

[env:atxmega128a1]
board = atxmega128a1
upload_flags = -px128a1

[env:atxmega128a3]
board = atxmega128a3
upload_flags = -px128a3
